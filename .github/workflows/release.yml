name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['electron/**', 'daemon/**', 'src/**', 'package.json', 'package-lock.json', 'scripts/smoke.mjs', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, script: 'dist:mac', arch: '--x64', exe: 'release/mac/Enxame.app/Contents/MacOS/Enxame', files: 'release/*.dmg' }
          - { os: macos-15, script: 'dist:mac', arch: '--arm64', exe: 'release/mac-arm64/Enxame.app/Contents/MacOS/Enxame', files: 'release/*.dmg' }
          - { os: windows-latest, script: 'dist:win', arch: '', exe: 'release/win-unpacked/Enxame.exe', files: 'release/*.exe' }
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Garante o binário do Electron baixado pelo postinstall; se faltar (cache parcial etc.), instala.
      - name: Garantir binário do Electron
        shell: bash
        run: node -e "require('fs').accessSync(require('electron'))" || node node_modules/electron/install.js
      - run: npm run typecheck
      # `--x64`/`--arm64` fixam o arch nos runners de mac: sem isso, o electron-builder pode tentar
      # empacotar os dois archs num runner que só tem um deles pronto.
      - run: npm run ${{ matrix.script }} -- ${{ matrix.arch }}
      - name: Smoke test do app empacotado
        timeout-minutes: 10
        run: node scripts/smoke.mjs "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: enxame-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: ${{ matrix.files }}
