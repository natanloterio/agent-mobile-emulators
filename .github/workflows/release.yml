name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['electron/**', 'daemon/**', 'src/**', 'package.json', 'package-lock.json', 'scripts/smoke.mjs', 'scripts/install-macos.sh', '.github/workflows/release.yml']

# Padrão mínimo; só o job `release` escreve.
permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, script: 'dist:mac', arch: '--x64', exe: 'release/mac/Tapflock.app/Contents/MacOS/Tapflock', files: 'release/*.dmg' }
          - { os: macos-15, script: 'dist:mac', arch: '--arm64', exe: 'release/mac-arm64/Tapflock.app/Contents/MacOS/Tapflock', files: 'release/*.dmg' }
          - { os: windows-latest, script: 'dist:win', arch: '', exe: 'release/win-unpacked/Tapflock.exe', files: 'release/*Setup*.exe' }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Garante o binário do Electron baixado pelo postinstall; se faltar (cache parcial etc.), instala.
      - name: Garantir binário do Electron
        shell: bash
        run: node -e "require('fs').accessSync(require('electron'))" || node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      # `--x64`/`--arm64` fixam o arch nos runners de mac: sem isso, o electron-builder pode tentar
      # empacotar os dois archs num runner que só tem um deles pronto.
      - run: npm run ${{ matrix.script }} -- ${{ matrix.arch }}
      - name: Smoke test do app empacotado
        timeout-minutes: 10
        run: node scripts/smoke.mjs "${{ matrix.exe }}"
      # O instalador de uma linha do README (curl | bash) roda sobre o DMG recém-gerado: monta,
      # copia o app e confere a assinatura ad-hoc, como faria na máquina de quem instala.
      - name: Instalador do macOS sobre o DMG
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          bash scripts/install-macos.sh --dmg release/*.dmg --dest "$RUNNER_TEMP/Applications" --no-open
          test -x "$RUNNER_TEMP/Applications/Tapflock.app/Contents/MacOS/Tapflock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tapflock-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Uma release só, depois que todos os sistemas passaram no smoke test.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*/*.dmg
            artifacts/*/*Setup*.exe
